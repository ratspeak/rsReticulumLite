name: Dependency audit

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**/Cargo.lock', '.github/workflows/dependency-audit.yml']
  pull_request:
    paths: ['**/Cargo.lock', '.github/workflows/dependency-audit.yml']

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install pinned auditor
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Check workspace and consumer lockfiles
        run: |
          cargo +stable audit --file Cargo.lock
          cargo +stable audit --file api/fixtures/Cargo.lock
